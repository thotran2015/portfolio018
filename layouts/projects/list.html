{{ define "main" }}
<section class="section section-1">
	<div class="container">
		<h1 class="title is-3">{{ .Title }}</h1>
		{{ .Content }}
		<ul>
			{{ range .Pages.ByDate }}
			<li>
				<a href="{{ .RelPermalink }}">{{ .Title }}</a>
				{{ with .Params.period }} — {{ . }}{{ end }}
			</li>
			{{ end }}
		</ul>
	</div>
</section>
{{ end }}
